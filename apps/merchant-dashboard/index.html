<!doctype html>
<html lang="ar" dir="rtl" data-product="store">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable dashboard (PWA): manifest, theme colour, iOS home-screen mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zimos" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Zimos — Merchant Dashboard</title>
    <!-- Set the theme class before first paint — no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var e = document.documentElement,
            s = null;
          try {
            s = localStorage.getItem("theme");
          } catch (_) {}
          var d =
            s === "dark" ||
            (s !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          e.classList.toggle("dark", d);
          e.style.colorScheme = d ? "dark" : "light";
          // Arabic first: the language the merchant chose, else Arabic, before first paint.
          var l = null;
          try {
            l = localStorage.getItem("zimos.locale");
          } catch (_) {}
          var en = l === "en";
          e.lang = en ? "en" : "ar";
          e.dir = en ? "ltr" : "rtl";
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
